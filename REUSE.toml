# Licences by path (REUSE specification, https://reuse.software). Decided by the owner on 2026-11-22:
# code MIT; facts (source registry, verification reports) CC BY 4.0; everything that makes the channel
# (characters, scripts, voice takes, videos, name, logo) all rights reserved, so that nobody can legally
# re-render the episodes and monetize a clone. A licence can be opened later, never closed again.
version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 mssnoussi92"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["content/sources/**", "reports/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 mssnoussi92"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = [
  "characters/**",
  "content/episodes/**",
  "content/casting/**",
  "assets/brand/**",
  "out/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 mssnoussi92"
SPDX-License-Identifier = "LicenseRef-AllRightsReserved"

[[annotations]]
path = ["assets/fonts/**"]
precedence = "override"
SPDX-FileCopyrightText = "The fonts' authors (see each font's OFL.txt)"
SPDX-License-Identifier = "OFL-1.1"
